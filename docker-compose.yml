# Self-host the Caspian gateway.
#
#   docker compose up
#
# That runs the gateway on http://localhost:8000 backed by Postgres, with the
# in-memory `fake` provider (no credentials needed) so you can point the SDK at
# it right away:  CommClient(base_url="http://localhost:8000", api_key="comm_dev_key_change_me")
#
# To use real channels: copy server/.env.example to ./.env, fill in what you
# need (COMM_PROVIDERS + that channel's credentials), then uncomment `env_file`.
services:
  gateway:
    build: ./server
    ports:
      - "8000:8000"
    environment:
      COMM_HOST: 0.0.0.0
      COMM_DATABASE_URL: ${COMM_DATABASE_URL:-postgresql://caspian:caspian@db:5432/caspian}
      COMM_PROVIDERS: ${COMM_PROVIDERS:-fake}
      COMM_BOOTSTRAP_API_KEY: ${COMM_BOOTSTRAP_API_KEY:-comm_dev_key_change_me}
      COMM_INLINE_WORKER: "true"
      COMM_PUBLIC_BASE_URL: ${COMM_PUBLIC_BASE_URL:-}
    # For real channels, create ./.env from server/.env.example and uncomment:
    # env_file:
    #   - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: caspian
      POSTGRES_PASSWORD: caspian
      POSTGRES_DB: caspian
    volumes:
      - caspian-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U caspian"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caspian-db:

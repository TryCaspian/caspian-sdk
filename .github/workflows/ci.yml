name: Lint & Test (SDKs)

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python-lint:
    name: Python lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

  python:
    name: Python SDK
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Test
        run: uv run pytest

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Core dependency gates
        run: bun run lint:deps

      - name: Test
        run: bun test

  typescript-cli:
    name: TypeScript CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      # The CLI depends on caspian via file:../typescript (source exports).
      # tsc follows into packages/typescript/src, so that package must have its
      # own node_modules (effect) installed — CLI install alone is not enough.
      - name: Install TypeScript SDK dependencies
        working-directory: packages/typescript
        run: bun install --frozen-lockfile

      - name: Install CLI dependencies
        working-directory: packages/cli
        run: bun install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/cli
        run: bun run typecheck

      - name: Lint
        working-directory: packages/cli
        run: bun run lint

      - name: Test
        working-directory: packages/cli
        run: bun test

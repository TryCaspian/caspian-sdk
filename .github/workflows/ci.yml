name: Lint & Test (SDKs)

permissions:
  contents: read

on:
  push:
    branches: [main, feat/rewrite, feat/rewrite-ts, feat/sdk-rewrite-latest]
  pull_request:

concurrency:
  group: lint-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python SDK
    # No job-level `if` here. hashFiles() is unavailable in jobs.<id>.if (only
    # github, needs, vars, inputs and the status functions are), so a condition
    # using it makes the whole workflow fail to compile: every run ends in 0s
    # with no jobs created and no log to read.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Test
        run: uv run pytest

  typescript:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/typescript
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Core dependency gates
        run: bun run lint:deps

      - name: Test
        run: bun test

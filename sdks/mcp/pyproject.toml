[project]
name = "caspian-mcp"
version = "0.1.0"
description = "Local MCP: Caspian inbox fetch through regex Sanitize. Mapping stays in this process."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Caspian", email = "ayushguptadev1@gmail.com" }]
dependencies = [
  "caspian-sdk>=0.6.4,<1",
  "cryptography>=44.0.0",
  "mcp>=1.12,<2",
  "python-dotenv>=1.0.0",
  "starlette>=0.40.0",
  "uvicorn>=0.32.0",
]

[project.urls]
Homepage = "https://trycaspianai.com"
Documentation = "https://api.trycaspianai.com/SKILL.md"

[project.scripts]
caspian-mcp = "caspian_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caspian_mcp"]

[tool.uv.sources]
caspian-sdk = { workspace = true }

[project]
name = "caspian-sdk-workspace"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "caspian",
]

[tool.uv]
package = false

[tool.uv.sources]
caspian = { workspace = true }

[tool.uv.workspace]
members = ["packages/python"]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=0.23",
  "pytest-cov>=6,<7",
  "ruff>=0.12,<1",
]

[tool.pytest.ini_options]
testpaths = ["packages/python/tests"]
addopts = "-q"


[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency-injection calls are safe in argument defaults.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Cookie", "fastapi.Body", "fastapi.Form", "fastapi.File", "fastapi.Security"]

[tool.ruff.lint.per-file-ignores]
# The version block is the point: ruff targets py312, but the SDK supports 3.10,
# where enum.StrEnum does not exist.
"packages/python/src/caspian/_compat.py" = ["UP036", "UP042"]
# Long lines here are content, not code: guide prose and an inline HTML/JS auth page.
"server/src/comm_gateway/channel_guides.py" = ["E501"]
"server/src/comm_gateway/routes/device.py" = ["E501"]
